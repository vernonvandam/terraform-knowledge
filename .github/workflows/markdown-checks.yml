name: Markdown Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown files exist
        shell: bash
        run: |
          find . -name '*.md' -print >/dev/null
          echo "Markdown files discovered successfully."
